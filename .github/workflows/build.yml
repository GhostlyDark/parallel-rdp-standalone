name: Build parallel-rdp plugin

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug

jobs:
  build-linux:
    name: Linux (.so)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: parallel-rdp-standalone
          submodules: recursive

      - name: Fetch Mupen64Plus API headers
        run: |
          git clone --depth=1 \
            https://github.com/mupen64plus/mupen64plus-core.git \
            mupen64plus-core

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            libvulkan-dev \
            libgl1-mesa-dev \
            pkg-config

      - name: Configure (CMake)
        working-directory: parallel-rdp-standalone
        run: |
          cmake -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ github.event.inputs.build_type }} \
            -DCONFIG_GUI=OFF

      - name: Build
        working-directory: parallel-rdp-standalone
        run: cmake --build build --parallel

      - name: Collect artifacts
        working-directory: parallel-rdp-standalone
        run: |
          mkdir -p dist
          find build -name "*.so" -exec cp {} dist/ \;

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: parallel-rdp-linux-${{ github.event.inputs.build_type }}-${{ github.sha }}
          path: parallel-rdp-standalone/dist/*.so
          if-no-files-found: warn
          retention-days: 30

  build-windows:
    name: Windows (.dll)
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: parallel-rdp-standalone
          submodules: recursive

      - name: Fetch Mupen64Plus API headers
        run: |
          git clone --depth=1 `
            https://github.com/mupen64plus/mupen64plus-core.git `
            mupen64plus-core

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: latest
          cache: true
          quiet: true

      - name: Configure (CMake)
        working-directory: parallel-rdp-standalone
        run: |
          cmake -B build `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=${{ github.event.inputs.build_type }} `
            -DCONFIG_GUI=OFF

      - name: Build
        working-directory: parallel-rdp-standalone
        run: cmake --build build --config ${{ github.event.inputs.build_type }} --parallel

      - name: Collect artifacts
        shell: pwsh
        working-directory: parallel-rdp-standalone
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Get-ChildItem -Recurse build -Filter "*.dll" | Copy-Item -Destination dist/

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: parallel-rdp-windows-${{ github.event.inputs.build_type }}-${{ github.sha }}
          path: parallel-rdp-standalone/dist/*.dll
          if-no-files-found: warn
          retention-days: 30
